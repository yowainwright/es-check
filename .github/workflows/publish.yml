name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  SOCKET_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY || secrets.SOCKET_API_KEY }}
  SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm run lint:ci

      - run: pnpm test
        env:
          CI: true

      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs resolve-dist-tag

      - name: Pack npm tarball
        id: pack
        run: node scripts/release/publish.mjs pack

      - name: Attest npm tarball
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Prepare release attestation
        id: release-attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/release/publish.mjs prepare-attestation

      - name: Publish npm package
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs publish-npm

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGSTORE_BUNDLE: ${{ steps.release-attestation.outputs.sigstore_bundle }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs publish-github
