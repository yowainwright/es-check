name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  SOCKET_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY || secrets.SOCKET_API_KEY }}
  SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm run lint:ci

      - run: pnpm test
        env:
          CI: true

      - name: Resolve npm dist-tag
        id: dist-tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs resolve-dist-tag

      - name: Pack npm tarball
        id: pack
        run: node scripts/release/publish.mjs pack

      - name: Attest npm tarball
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Prepare release attestation
        id: release-attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/release/publish.mjs prepare-attestation

      - name: Publish npm package
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs publish-npm

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIGSTORE_BUNDLE: ${{ steps.release-attestation.outputs.sigstore_bundle }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/release/publish.mjs publish-github
